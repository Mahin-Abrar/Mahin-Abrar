    .t{opacity:0;animation:fade 2.4s ease-out .4s forwards} @keyframes fade{to{opacity:1}}
    .d{opacity:0;animation:fade .3s forwards}
    </style><rect width="860" height="300" rx="14" fill="url(#bg)"/>
