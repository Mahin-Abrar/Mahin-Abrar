<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="See you, space cowboy..."><title>See you, space cowboy...</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#0d1526"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140d1d"/><stop offset=".35" stop-color="#3a1f3d"/><stop offset=".68" stop-color="#a3364a"/><stop offset="1" stop-color="#e5653f"/></linearGradient>
    <filter id="cloud" x="-20%" y="-50%" width="140%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".018 .05" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="60"/><feGaussianBlur stdDeviation="3"/></filter>
