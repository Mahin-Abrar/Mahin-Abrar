<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="Mahin Abrar — Python Software Engineer"><title>Mahin Abrar — Python Software Engineer</title><defs><clipPath id="c"><rect width="860" height="240" rx="14"/></clipPath><filter id="soft" x="-50%" width="200%"><feGaussianBlur stdDeviation="1.4"/></filter></defs><style>
    .in{opacity:0;animation:in 1.2s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .rule{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:rule 1s cubic-bezier(.7,0,.2,1) .6s forwards}
    @keyframes rule{to{transform:scaleX(1)}}
    .spike{opacity:0;animation:fade 1.6s ease-out .2s forwards} @keyframes fade{to{opacity:1}}
    .smoke{stroke-dasharray:120;stroke-dashoffset:120;animation:rise 5s ease-out infinite 1.5s}
    @keyframes rise{0%{stroke-dashoffset:120;opacity:0}20%{opacity:.5}100%{stroke-dashoffset:-120;opacity:0}}
    </style><g clip-path="url(#c)">
