    <g class="in" style="animation-delay:.3s"><text x="64" y="132" font-family="Impact,Anton,Oswald,'Roboto Condensed','Arial Narrow',sans-serif" font-size="76" font-weight="900" letter-spacing="2" fill="#202741">MAHIN ABRAR</text></g>
    <rect class="rule" x="66" y="152" width="56" height="3" fill="#d6403a"/>
    <g class="in" style="animation-delay:.9s"><text x="138" y="158" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="5" fill="#202741">PYTHON · SOFTWARE ENGINEER</text></g>
    </g></svg>
