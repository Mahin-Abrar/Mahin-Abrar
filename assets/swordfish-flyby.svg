    .scan{animation:scan 10s ease-in-out infinite} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(560px)}}
    text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
