<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="120" viewBox="0 0 720 120" role="img">
  <title>Swordfish flyby</title>
  <rect width="720" height="120" fill="#0b0f14"/>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <g id="dust" class="mono" font-size="12" fill="#6b7c8a" opacity="0.75">
    <text x="30" y="24">·  ·    ?      ·     .</text>
    <text x="400" y="40">.   ·     ?   ·</text>
    <text x="80" y="100">?     ·   .      ·</text>
    <text x="480" y="90">·    ?     ·</text>
  </g>
  <animateTransform xlink:href="#dust" attributeName="transform" type="translate" values="0 0; -36 0; 0 0" dur="12s" repeatCount="indefinite"/>

  <g id="ship" class="mono" font-size="14" fill="#9eb6c4">
    <text x="0" y="52" xml:space="preserve">            .</text>
    <text x="0" y="68" xml:space="preserve">   -=&lt;[|||||&gt;·-·-</text>
    <text x="0" y="84" xml:space="preserve">         `·.</text>
  </g>
  <animateTransform xlink:href="#ship" attributeName="transform" type="translate" values="-160 0; 780 0" dur="9s" repeatCount="indefinite"/>

  <text class="mono" font-size="11" fill="#3d4f5c" x="360" y="112" text-anchor="middle">swordfish II · outbound</text>
</svg>
