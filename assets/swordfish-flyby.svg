    .lock{opacity:0;animation:lock 10s infinite}
    @keyframes lock{0%,30%{opacity:0;transform:scale(1.6)}34%{opacity:1;transform:scale(1)}37%{opacity:.3}40%,52%{opacity:1}56%,100%{opacity:0}}
